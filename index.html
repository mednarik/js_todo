<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <script>
            let tasks = [];
            function save_task() {
                let element = document.getElementById("plac_task");
                let input = element.querySelector("input");
                let text = input.value.trim()
                tasks.push(text);
            }
        </script>
        <div id="bg">
            <div id="plac_task">
                <input type="text" class="text">
            </div>
            <button type="button" id="confirm" onclick="save_task()">Confirm</button>
        </div>
    </body>
</html>
